<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svetainė nepasiekiama</title>

  <style>
    body {
      margin: 0;
    }

    .unavailable-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .unavailable-box {
      max-width: 520px;
      width: 90%;
      padding: 35px 25px;
      background: #ffffff;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .unavailable-box h1 {
      margin: 0 0 15px;
      font-size: 28px;
      color: #222;
    }

    .unavailable-box p {
      margin: 0 0 10px;
      font-size: 17px;
      line-height: 1.5;
      color: #444;
    }

    .unavailable-box .small-text {
      font-size: 15px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="unavailable-page">
    <div class="unavailable-box">
      <h1>Atsiprašome</h1>
      <p>Dėl didelio užklausų skaičiaus svetainė šiuo metu yra nepasiekiama.</p>
      <p class="small-text">Bandykite dar kartą vėliau.</p>
    </div>
  </div>

</body>
</html>
