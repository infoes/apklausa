<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Svetainė nepasiekiama</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
    }

    .box {
      max-width: 560px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 30px;
      margin: 0 0 16px;
    }

    p {
      font-size: 16px;
      color: #555;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .small {
      margin-top: 22px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Atsiprašome</h1>
    <p>Dėl didelio užklausų skaičiaus svetainė šiuo metu yra nepasiekiama.</p>
    <p class="small">Bandykite dar kartą vėliau.</p>
  </div>

  <script>
    const LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbyxpwxAqDEzIyyRFlKaRNolcEExlO38B-5vkkJS06XHkKuUEFnNeFoy1HvOPGtKYBzM/exec";

    function getUidFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("uid") || "UNKNOWN";
    }

    const uid = getUidFromUrl();

    const page = window.location.href;
    const ua = navigator.userAgent;

    const url =
      LOG_ENDPOINT +
      "?uid=" + encodeURIComponent(uid) +
      "&event=404_view" +
      "&answer=" +
      "&page=" + encodeURIComponent(page) +
      "&ua=" + encodeURIComponent(ua);

    fetch(url).catch(function(error) {
      console.error("Log error:", error);
    });
  </script>
</body>
</html>
